<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Canvas</title>
		<script src="./index.js" defer></script>
	</head>
	<body>
		//Начало работы с canvas в JavaScript
		<canvas id="one" width="200" height="200"></canvas>
		<br /><br />
		//Рисование линий через canvas на JavaScript
		<canvas
			id="two"
			width="200"
			height="200"
			style="background: #529e43"
		></canvas>
		<br /><br />

		// Квадрат
		<canvas
			id="three"
			width="200"
			height="200"
			style="background: #b13a3a"
		></canvas>
		<br /><br />

		//Закрашивание фигур
		<canvas
			id="four"
			width="200"
			height="200"
			style="background: #c92da5"
		></canvas>
		<br /><br />
		//Task
		<button id="swap">swap</button>
		<br /><br />
		<canvas
			id="taskOne"
			width="200"
			height="200"
			style="background: #90d3a8"
		></canvas>

		<p>Рисование прямоугольников через canvas на JavaScript</p>
		<br /><br />
		<canvas
			id="strokeRect"
			width="200"
			height="200"
			style="background: #f4f4f4"
		></canvas>

		<p>Рисование окружностей через canvas на JavaScript</p>
		<br /><br />
		<canvas
			id="circle"
			width="200"
			height="200"
			style="background: #f4f4f4"
		></canvas>
	</body>
</html>
